<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #efece2; color: #23211c; font-family: "Zen Kaku Gothic New", sans-serif; }
    a { color: #23211c; } a:hover { color: #a4402f; }
    .mincho { font-family: "Shippori Mincho", serif; }
  </style>
</helmet>

<div style="width: 1280px; height: 900px; box-sizing: border-box; padding: 60px 72px; display: grid; grid-template-columns: 132px minmax(0, 1fr) 300px; gap: 56px; background-image: radial-gradient(#e2ddd0 1px, transparent 1px); background-size: 7px 7px">

  <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: center">
    <div class="mincho" style="writing-mode: vertical-rl; font-size: 30px; letter-spacing: 0.22em; line-height: 1.3">一日一結</div>
    <div style="width: 52px; height: 52px; border: 2px solid #a4402f; color: #a4402f; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 21px">結</div>
  </div>

  <div style="display: flex; flex-direction: column; justify-content: center; gap: 34px">
    <div style="width: 100%; max-width: 470px; aspect-ratio: 1; align-self: center; box-shadow: 0 18px 44px -28px rgba(35,33,28,0.5)"><!--KNOT-A--></div>
    <div style="display: flex; justify-content: center; gap: 14px">
      <div style="width: 58px"><div style="height:58px; opacity:0.85"><!--KNOT4-B--></div></div>
      <div style="width: 58px"><div style="height:58px; border:1px solid #dad4c5"></div></div>
      <div style="width: 58px"><div style="height:58px; opacity:0.85"><!--KNOT4-G--></div></div>
      <div style="width: 58px"><div style="height:58px; opacity:0.85"><!--KNOT4-F--></div></div>
      <div style="width: 58px"><div style="height:58px; border:1px solid #dad4c5"></div></div>
      <div style="width: 58px"><div style="height:58px; opacity:0.85"><!--KNOT4-E--></div></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; justify-content: center; gap: 30px">
    <div>
      <div style="font-size: 12px; letter-spacing: 0.2em; color: #8c8577">ONENFT.CLICK</div>
      <div class="mincho" style="font-size: 34px; line-height: 1.35; margin-top: 16px">Czterysta<br>dwunasta doba</div>
    </div>
    <div style="font-size: 14px; line-height: 1.9; color: #4d4941">
      Splot zawiązuje się sam, z numeru bloku. Nie ma autora dnia,
      jest tylko ten, kto przyszedł go odebrać.
    </div>
    <div style="height: 1px; background: #dad4c5"></div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <a href="#" style="display: flex; align-items: center; justify-content: center; height: 54px; border: 1px solid #23211c; text-decoration: none; font-size: 15px; letter-spacing: 0.1em">受け取る · odbierz</a>
      <div style="font-size: 12px; line-height: 1.85; color: #8c8577">
        Za darmo, poza gazem. Okno zamyka się o świcie —<br>zostaje 6 h 41 min. Co dziesiąty splot należy do autora.
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
